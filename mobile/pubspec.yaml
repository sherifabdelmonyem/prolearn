name: mobile
description: ProLearn Mobile Application
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ">=3.12.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # Networking
  dio: ^5.8.0+1
  http: ^1.2.2

  # State Management
  provider: ^6.1.5

  # Local Storage
  shared_preferences: ^2.5.3

  # Pick Files
  file_picker: ^10.2.0

  # Audio
  audioplayers: ^6.5.0

  # Text To Speech
  flutter_tts: ^4.2.3

  # Speech To Text
  speech_to_text: ^7.0.0

  # UI
  google_fonts: ^6.3.0
  flutter_screenutil: ^5.9.3

  # Icons
  flutter_svg: ^2.2.0

  # Loading
  flutter_spinkit: ^5.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  # assets:
    #- assets/images/
    #- assets/icons/